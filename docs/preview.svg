<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">工作脉络 1.0.0 界面预览</title>
  <desc id="desc">展示年度概览、数据年度切换、工作热力图、跨年度长期事项和工作记录的抽象界面预览，不包含真实工作数据。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbf8"/><stop offset="1" stop-color="#eaf4ee"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b3d2e"/><stop offset="1" stop-color="#1a7f5a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#144b35" flood-opacity=".10"/></filter>
  </defs>

  <rect width="1280" height="720" rx="24" fill="url(#page)"/>

  <!-- Sidebar -->
